{% extends 'base.html' %}
{% block content %}
  <h2>Confirmar Exclusão</h2>
  
  <div class="alert alert-warning" role="alert">
    <p>Tem certeza que deseja remover este exercício?</p>
    <p><strong>{{ exercise.question|truncatewords:20 }}</strong></p>
    <p>Esta ação não pode ser desfeita.</p>
  </div>
  
  <form method="post" style="display:inline">{% csrf_token %}
    <button class="btn btn-danger" type="submit">Sim, Remover</button>
    <a class="btn btn-secondary" href="{% url 'exercises:detail' exercise.pk %}">Cancelar</a>
  </form>
{% endblock %}
