{% extends 'base.html' %}
{% block content %}
  <div class="row justify-content-center mt-5">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Entrar</h2>
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="{{ form.username.id_for_label }}" class="form-label">Usuário</label>
              {{ form.username }}
            </div>
            <div class="mb-3">
              <label for="{{ form.password.id_for_label }}" class="form-label">Senha</label>
              {{ form.password }}
            </div>
            <button class="btn btn-primary w-100" type="submit">Entrar</button>
          </form>
          <hr>
          <p class="text-center mb-0">
            Não tem conta? <a href="{% url 'register' %}" class="link-primary">Registre-se aqui</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <style>
    #id_username, #id_password {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #dee2e6;
      border-radius: 0.375rem;
      font-size: 1rem;
    }
    #id_username:focus, #id_password:focus {
      border-color: #80bdff;
      outline: 0;
      box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }
  </style>
{% endblock %}
